# Reusable checks: analyze, Flutter tests, functions tests, web build, version
# check. Uploads the built web app as an artifact so the deploy job ships
# exactly what was tested.
name: checks

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (SHA, tag or branch) to check and build.
        type: string
        required: true
      run_tests:
        description: Run Flutter and functions tests (analyze and build always run).
        type: boolean
        default: true
      app_env:
        description: "prod (default, tashil-gift: the exact same build as before) or dev (--dart-define=APP_ENV=dev, tashil-gift-dev)."
        type: string
        default: prod
    outputs:
      artifact:
        description: Name of the uploaded web build artifact.
        value: ${{ jobs.checks.outputs.artifact }}
      sha:
        description: Full commit SHA that was checked and built.
        value: ${{ jobs.checks.outputs.sha }}
      version:
        description: App version X.Y.Z+N of the build.
        value: ${{ jobs.checks.outputs.version }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.sha.outputs.artifact }}
      sha: ${{ steps.sha.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    env:
      APP_ENV: ${{ inputs.app_env }}
    steps:
      - name: APP_ENV must be prod or dev
        run: |
          case "$APP_ENV" in prod|dev) echo "APP_ENV=$APP_ENV" ;; *) echo "::error::app_env must be prod or dev, got '$APP_ENV'"; exit 1 ;; esac

      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # CI scripts come from the commit that holds this workflow, so an older
      # ref (rollback) that predates tool/ci/ can still be checked and built.
      - name: Checkout CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: _ci
          persist-credentials: false
          # Non-cone mode: only these paths, not the root files (a second
          # pubspec.yaml under _ci/ would be picked up by flutter analyze).
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/ci/
            /.fvmrc

      - name: Resolve SHA
        id: sha
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # prod keeps the old artifact name; dev builds get their own.
          if [ "$APP_ENV" = "dev" ]; then echo "artifact=web-build-dev-$sha"; else echo "artifact=web-build-$sha"; fi >> "$GITHUB_OUTPUT"

      - name: Flutter version from .fvmrc
        id: flutter
        run: |
          f=.fvmrc; [ -f "$f" ] || f=_ci/.fvmrc
          v=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['flutter'])" "$f")
          echo "Flutter $v (from $f)"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Version check (pubspec, app_version_config, web/version.json)
        run: python3 _ci/tool/ci/check_version.py

      - name: flutter analyze (infos never fail; errors and new warnings do)
        run: bash _ci/tool/ci/analyze.sh _ci/tool/ci/analyze_baseline.txt

      - name: flutter test (blocking, all files except the known-failing list)
        if: inputs.run_tests
        run: bash _ci/tool/ci/flutter_test.sh blocking _ci/tool/ci/known_failing_tests.txt

      - name: flutter test (known-failing files, not blocking)
        if: inputs.run_tests
        run: bash _ci/tool/ci/flutter_test.sh known _ci/tool/ci/known_failing_tests.txt

      - name: Set up Node 22
        if: inputs.run_tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: functions npm ci + npm test
        if: inputs.run_tests
        working-directory: functions
        run: |
          npm ci
          npm test

      # prod: exactly the same command as before the env split (no defines).
      - name: flutter build web --release (prod)
        if: env.APP_ENV == 'prod'
        run: flutter build web --release

      # dev: tashil-gift-dev options + the dev App Check site key (repository
      # variable DEV_APP_CHECK_RECAPTCHA_SITE_KEY; empty disables web App Check).
      - name: flutter build web --release (APP_ENV=dev)
        if: env.APP_ENV == 'dev'
        env:
          DEV_APP_CHECK_KEY: ${{ vars.DEV_APP_CHECK_RECAPTCHA_SITE_KEY }}
        run: |
          flutter build web --release \
            --dart-define=APP_ENV=dev \
            --dart-define=APP_CHECK_RECAPTCHA_SITE_KEY="$DEV_APP_CHECK_KEY"
          python3 _ci/tool/ci/stamp_env.py build/web dev

      - name: Version check on the build
        id: version
        run: python3 _ci/tool/ci/check_version.py --built build/web --env "$APP_ENV" | tee /dev/stderr | grep '^version=' >> "$GITHUB_OUTPUT"

      - name: Upload web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.sha.outputs.artifact }}
          path: build/web
          if-no-files-found: error
          retention-days: 7
