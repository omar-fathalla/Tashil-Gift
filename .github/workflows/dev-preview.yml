# dev: checks on every PR into dev and every push to dev, then a Hosting
# preview.
#
# Backend selection (job "target"):
#   dev  - the FIREBASE_SERVICE_ACCOUNT_TASHIL_GIFT_DEV secret exists AND
#          lib/firebase_options_dev.dart is filled in. The app is built with
#          APP_ENV=dev and deployed to tashil-gift-dev only:
#            pull request to dev -> channel "pr-<N>" on tashil-gift-dev
#            push to dev         -> the live site https://tashil-gift-dev.web.app
#                                   (+ functions/rules/indexes when the
#                                   repository variable DEV_AUTO_DEPLOY_BACKEND
#                                   is "true")
#   prod-legacy - until then (the dev project is not set up yet), the old
#          behaviour: a Hosting-only channel on tashil-gift that uses the
#          PRODUCTION Firestore, Auth, Storage and Functions. Set the
#          repository variable DISABLE_PROD_PREVIEW_FALLBACK=true to turn it
#          off (TAG-27). It never deploys functions, rules or the live site.
# Missing dev secret/config never fails CI: the dev path is skipped.
name: dev-preview

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: dev-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.pick.outputs.backend }}
      app_env: ${{ steps.pick.outputs.app_env }}
    steps:
      - name: Checkout (dev config status only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lib/firebase_options_dev.dart
            /tool/ci/dev_config_status.py

      - name: Pick the preview backend
        id: pick
        env:
          HAS_DEV_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TASHIL_GIFT_DEV != '' }}
          NO_FALLBACK: ${{ vars.DISABLE_PROD_PREVIEW_FALLBACK == 'true' }}
        run: |
          configured=false
          if [ -f tool/ci/dev_config_status.py ]; then
            configured=$(python3 tool/ci/dev_config_status.py | sed -n 's/^configured=//p')
          fi
          if [ "$HAS_DEV_SA" = "true" ] && [ "$configured" = "true" ]; then
            backend=dev
          elif [ "$NO_FALLBACK" = "true" ]; then
            backend=none
          else
            backend=prod-legacy
          fi
          app_env=prod; [ "$backend" = "dev" ] && app_env=dev
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "app_env=$app_env" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview backend: \`$backend\`"
            echo "- dev service account secret: $HAS_DEV_SA"
            echo "- lib/firebase_options_dev.dart filled in: $configured"
            if [ "$backend" != "dev" ]; then
              echo "- tashil-gift-dev is not ready yet, so the dev deploy is **skipped** (docs/DEV_ENVIRONMENT.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$backend" = "dev" ] || echo "::notice::tashil-gift-dev deploy skipped (secret=$HAS_DEV_SA, config=$configured). See docs/DEV_ENVIRONMENT.md."

  checks:
    needs: target
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      app_env: ${{ needs.target.outputs.app_env }}

  # ---- tashil-gift-dev (APP_ENV=dev build) -------------------------------
  preview-dev:
    needs: [target, checks]
    # Secrets are not available to PRs from forks; skip instead of failing.
    if: needs.target.outputs.backend == 'dev' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.url }}
    env:
      PROJECT: tashil-gift-dev
      CHANNEL: ${{ github.event_name == 'push' && 'live' || format('pr-{0}', github.event.pull_request.number) }}
      FIREBASE_TOOLS_VERSION: 15.37.0
    steps:
      - name: Checkout ${{ needs.checks.outputs.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.sha }}
          persist-credentials: false

      - name: Download web build (APP_ENV=dev)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.checks.outputs.artifact }}
          path: build/web

      - name: The build must be an env=dev build
        run: python3 tool/ci/check_version.py --built build/web --env dev

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Write dev deploy credentials to $RUNNER_TEMP
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TASHIL_GIFT_DEV }}
        run: |
          umask 077
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          sa_project=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('project_id',''))" "$RUNNER_TEMP/gcp-sa.json")
          if [ "$sa_project" != "$PROJECT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_TASHIL_GIFT_DEV belongs to '$sa_project', not $PROJECT. Refusing."
            rm -f "$RUNNER_TEMP/gcp-sa.json"; exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"

      - name: Deploy Hosting (${{ env.CHANNEL }}) to tashil-gift-dev
        id: deploy
        run: |
          python3 tool/dev/render_firebase_dev_json.py
          if [ "$CHANNEL" = "live" ]; then
            npx -y "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy --project "$PROJECT" --config firebase.dev.json \
              --only hosting --non-interactive --message "dev ${{ needs.checks.outputs.version }} ${{ needs.checks.outputs.sha }}"
            echo "url=https://$PROJECT.web.app" >> "$GITHUB_OUTPUT"
          else
            npx -y "firebase-tools@${FIREBASE_TOOLS_VERSION}" hosting:channel:deploy "$CHANNEL" --project "$PROJECT" \
              --config firebase.dev.json --expires 7d --non-interactive --json > "$RUNNER_TEMP/channel.json"
            url=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); r=d['result']; print(next(iter(r.values()))['url'])" "$RUNNER_TEMP/channel.json")
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy rules + indexes to tashil-gift-dev (DEV_AUTO_DEPLOY_BACKEND)
        if: github.event_name == 'push' && vars.DEV_AUTO_DEPLOY_BACKEND == 'true'
        run: |
          # Rules first: they are quick and independent, so a functions
          # problem never leaves dev on stale rules.
          bash tool/dev/deploy_dev.sh rules

      # Fake demo data (tool/seed_dev.js) on a push to dev whose commit message
      # contains [seed]. Idempotent. Passwords never reach the job log: they go
      # to a 1-day artifact named dev-seed-credentials.
      - name: Seed fake demo data on tashil-gift-dev ([seed] in the commit message)
        if: github.event_name == 'push' && vars.DEV_AUTO_DEPLOY_BACKEND == 'true' && contains(github.event.head_commit.message, '[seed]')
        run: |
          (cd functions && npm ci)
          umask 077
          node tool/seed_dev.js --project "$PROJECT" --confirm "$PROJECT" --reset-passwords --credentials-out "$RUNNER_TEMP/dev-seed-credentials.txt"
          touch "$RUNNER_TEMP/dev-seed-credentials.txt"

      - name: Upload the new seed credentials (1 day)
        if: github.event_name == 'push' && vars.DEV_AUTO_DEPLOY_BACKEND == 'true' && contains(github.event.head_commit.message, '[seed]')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-seed-credentials
          path: ${{ runner.temp }}/dev-seed-credentials.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: Deploy functions to tashil-gift-dev (DEV_AUTO_DEPLOY_BACKEND)
        if: github.event_name == 'push' && vars.DEV_AUTO_DEPLOY_BACKEND == 'true'
        run: |
          [ -d functions/node_modules ] || (cd functions && npm ci)
          bash tool/dev/deploy_dev.sh functions

      - name: Verify the preview serves this build (env=dev)
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          live=$(curl -fsS "$URL/version.json?t=$GITHUB_RUN_ID")
          echo "$live"
          got=$(python3 -c "import json,sys; d=json.loads(sys.argv[1]); print(f\"{d['version']}+{d['build_number']} {d.get('env','prod')}\")" "$live")
          [ "$got" = "$VERSION dev" ] || { echo "::error::preview serves '$got', expected '$VERSION dev'"; exit 1; }
          {
            echo "### Dev preview \`$CHANNEL\` (tashil-gift-dev)"
            echo "- URL: $URL"
            echo "- Commit: \`${{ needs.checks.outputs.sha }}\`"
            echo "- App version: $VERSION (env dev)"
            echo "- Backend: **tashil-gift-dev** (fake data, no production writes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview link on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          marker='<!-- dev-preview-link -->'
          body="$marker
          **Dev preview (tashil-gift-dev, fake data):** $URL
          Version $VERSION, commit \`${{ needs.checks.outputs.sha }}\`, expires in 7 days."
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" -f body="$body" >/dev/null
          fi

      - name: Remove deploy credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json" "$RUNNER_TEMP/channel.json"

  # ---- legacy: Hosting-only channel on tashil-gift (production backend) ----
  # Kept only until tashil-gift-dev is ready, so PR previews keep working.
  preview:
    needs: [target, checks]
    if: needs.target.outputs.backend == 'prod-legacy' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHANNEL: ${{ github.event_name == 'push' && 'dev' || format('pr-{0}', github.event.pull_request.number) }}
      FIREBASE_TOOLS_VERSION: 15.37.0
    steps:
      - name: Checkout (firebase.json)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.sha }}
          persist-credentials: false

      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.checks.outputs.artifact }}
          path: build/web

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Write deploy credentials to $RUNNER_TEMP
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TASHIL_GIFT }}
        run: |
          umask 077
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"

      # Preview channel only: never the live site, functions, rules or indexes.
      - name: Deploy Hosting preview channel (expires in 7 days)
        id: deploy
        run: |
          npx -y "firebase-tools@${FIREBASE_TOOLS_VERSION}" hosting:channel:deploy "$CHANNEL" \
            --project tashil-gift --expires 7d --non-interactive --json > "$RUNNER_TEMP/channel.json"
          cat "$RUNNER_TEMP/channel.json"
          url=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); r=d['result']; print(next(iter(r.values()))['url'])" "$RUNNER_TEMP/channel.json")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify the preview serves this build
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          live=$(curl -fsS "$URL/version.json?t=$GITHUB_RUN_ID")
          echo "$live"
          got=$(python3 -c "import json,sys; d=json.loads(sys.argv[1]); print(f\"{d['version']}+{d['build_number']}\")" "$live")
          [ "$got" = "$VERSION" ] || { echo "::error::preview serves $got, expected $VERSION"; exit 1; }
          {
            echo "### Hosting preview \`$CHANNEL\` (legacy, production backend)"
            echo "- URL: $URL"
            echo "- Commit: \`${{ needs.checks.outputs.sha }}\`"
            echo "- App version: $VERSION"
            echo "- Expires: 7 days after this deploy"
            echo "- Uses the **production** Firestore, Auth, Storage and Cloud Functions (tashil-gift-dev is not ready yet)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove deploy credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json" "$RUNNER_TEMP/channel.json"
