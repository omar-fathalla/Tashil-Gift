# Test gate (TAG-82): runs only the tools a change needs, picked from the
# changed files by tool/ci/gate_buckets.py. Here in CI that means the static
# guards and the rules/functions emulator suites (job "gate") and Patrol web
# on the emulators (job "patrol", only when the change needs it); analyze,
# flutter test and the functions unit tests already run in checks.yml through
# dev-preview.yml. Maestro runs on the Mac only.
#
# Separate on purpose: checks.yml is also called by deploy-production.yml
# (deploys and rollbacks), so nothing from the gate may live there.
# No secrets, no Google credentials, demo-* emulator projects only. Never
# deploys. To make it block merges, add BOTH "gate" and "patrol" as required
# checks on dev. "patrol" passes (skips its steps) when a change does not need
# Patrol, so requiring it never blocks an unrelated PR.
name: gate

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FIREBASE_TOOLS_VERSION: 15.37.0
      GOOGLE_APPLICATION_CREDENTIALS: ""
    steps:
      - name: Checkout (full history, for the diff against the base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Base of the change
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$BEFORE"; fi
          # A new branch pushes with an all-zero "before": fall back to the parent.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="HEAD~1"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          python3 tool/ci/gate_buckets.py --base "$base"

      - name: Java 21 (Firestore emulator)
        run: |
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            rules-tests/package-lock.json

      - name: Run the gate (tools for this change)
        env:
          BASE: ${{ steps.base.outputs.base }}
        # runner.temp is not available in job-level env, so set it here.
        run: GATE_OUT="$RUNNER_TEMP/gate" bash tool/ci/run_gate.sh --ci --base "$BASE" --skip patrol

  patrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FIREBASE_TOOLS_VERSION: 15.37.0
      PATROL_CLI_VERSION: 4.10.0
      PATROL_VERBOSE: "1"   # Playwright stderr and app logs in the job log
      GOOGLE_APPLICATION_CREDENTIALS: ""
    steps:
      - name: Checkout (full history, for the diff against the base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Does this change need Patrol?
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="HEAD~1"; fi
          eval "$(python3 tool/ci/gate_buckets.py --base "$base" --format shell)"
          case " $TOOLS " in *" patrol "*) run=true ;; *) run=false ;; esac
          echo "Buckets: $BUCKETS. Patrol needed: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Java 21 (Firestore emulator)
        if: steps.plan.outputs.run == 'true'
        run: |
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: Set up Node 22
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Flutter version from .fvmrc
        if: steps.plan.outputs.run == 'true'
        id: flutter
        run: |
          v=$(python3 -c "import json; print(json.load(open('.fvmrc'))['flutter'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        if: steps.plan.outputs.run == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: patrol_cli
        if: steps.plan.outputs.run == 'true'
        run: |
          dart pub global activate patrol_cli "$PATROL_CLI_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Patrol web on the emulators (headless Chrome)
        if: steps.plan.outputs.run == 'true'
        run: GATE_OUT="$RUNNER_TEMP/gate" bash tool/ci/run_gate.sh --ci --only patrol

      - name: Patrol report
        if: always() && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patrol-report
          path: ${{ runner.temp }}/gate/
          retention-days: 7
          if-no-files-found: ignore
