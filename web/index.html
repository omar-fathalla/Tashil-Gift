  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F8FAF3;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #app-splash-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F8FAF3;
      z-index: 999999;
      transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.28s;
    }

    #app-splash-loader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 40px;
      border-radius: 24px;
      background: #FFFFFF;
      border: 1px solid rgba(74, 93, 35, 0.14);
      box-shadow: 0 12px 32px rgba(74, 93, 35, 0.06);
      max-width: 320px;
      width: 85%;
      text-align: center;
    }

    .splash-logo-badge {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #4A5D23 0%, #637B30 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 6px 16px rgba(74, 93, 35, 0.25);
      margin-bottom: 16px;
      animation: pulseBadge 1.8s infinite ease-in-out;
    }

    .splash-title {
      font-size: 18px;
      font-weight: 800;
      color: #1B1C18;
      margin: 0 0 6px 0;
    }

    .splash-subtitle {
      font-size: 13px;
      color: #5C5F52;
      margin: 0 0 20px 0;
    }

    .m3-linear-progress {
      width: 100%;
      height: 6px;
      background-color: #E3E8D8;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .m3-linear-progress-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 45%;
      background-color: #4A5D23;
      border-radius: 999px;
      animation: m3Indeterminate 1.25s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes m3Indeterminate {
      0% { right: -45%; width: 35%; }
      50% { width: 55%; }
      100% { right: 100%; width: 35%; }
    }

    @keyframes pulseBadge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <!-- Instant M3 HTML Splash Screen (Eliminates White Screen) -->
  <div id="app-splash-loader">
    <div class="splash-card">
      <div class="splash-logo-badge">G</div>
      <h1 class="splash-title">تسهيل جيفت • Tashil Gift</h1>
      <p class="splash-subtitle">جاري تهيئة بوابة العمليات الذكية...</p>
      <div class="m3-linear-progress">
        <div class="m3-linear-progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // Handle legacy hash URLs (e.g. /#/c/512?event=...) by converting them to clean path URLs before Flutter boots
    (function() {
      const hash = window.location.hash;
      if (hash && (hash.startsWith('#/') || hash.startsWith('#!/'))) {
        const cleanPath = hash.replace(/^#!?/, '');
        if (cleanPath.startsWith('/')) {
          window.history.replaceState(null, '', cleanPath);
        }
      }
    })();

    // Hide the HTML splash loader immediately when Flutter renders its first frame
    function dismissSplashLoader() {
      const loader = document.getElementById('app-splash-loader');
      if (loader && !loader.classList.contains('loaded')) {
        loader.classList.add('loaded');
        setTimeout(() => loader.remove(), 350);
      }
    }

    window.addEventListener('flutter-first-frame', dismissSplashLoader);
    // Fallback observer in case flutter-first-frame already fired
    const observer = new MutationObserver(() => {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        dismissSplashLoader();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 2.0.172: splash watchdog. If Flutter has not painted after 20s (stale
    // service worker / blocked CDN / hung init), offer a one-tap clean reload
    // instead of spinning forever; after 40s do it automatically once.
    setTimeout(function () {
      const loader = document.getElementById('app-splash-loader');
      if (!loader || loader.classList.contains('loaded')) return;
      const card = loader.querySelector('.splash-card');
      if (card && !document.getElementById('splash-retry')) {
        const p = document.createElement('p');
        p.className = 'splash-subtitle';
        p.textContent = 'التحميل بياخد وقت أطول من المعتاد.';
        const b = document.createElement('button');
        b.id = 'splash-retry';
        b.textContent = 'إعادة المحاولة';
        b.style.cssText = 'margin-top:12px;padding:10px 24px;border:0;border-radius:20px;background:#5A5E1E;color:#fff;font-size:14px;cursor:pointer';
        b.onclick = function () { window.tashilHardReload ? window.tashilHardReload() : location.reload(); };
        card.appendChild(p); card.appendChild(b);
      }
    }, 20000);
    setTimeout(function () {
      const loader = document.getElementById('app-splash-loader');
      if (!loader || loader.classList.contains('loaded')) return;
      try {
        if (sessionStorage.getItem('tashil_splash_autoreload')) return;
        sessionStorage.setItem('tashil_splash_autoreload', '1');
      } catch (e) { return; }
      if (window.tashilHardReload) window.tashilHardReload();
    }, 40000);
  </script>
  <script>
    // Used by the "يوجد إصدار جديد" banner: drop the service worker and its
    // caches, then reload so the new build is fetched from the network.
    window.tashilHardReload = async function () {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
      } catch (e) {}
      window.location.reload();
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // 2.0.148+209: browser-native receipt resize (lib/core/utils/web_image_resizer_web.dart).
    // Decodes with the browser (so iOS Safari HEIC/HEIF and EXIF orientation work),
    // scales to fit maxW x maxH, applies the same brightness-then-contrast math as
    // package:image adjustColor, and encodes JPEG. Resolves null on any failure so
    // Dart falls back to the pure-Dart calibrator.
    window.tashilResizeReceiptImage = async function (bytes, maxW, maxH, quality, contrast, brightness) {
      let url = null;
      try {
        const blob = new Blob([bytes]);
        let src = null, w = 0, h = 0;
        if (typeof createImageBitmap === 'function') {
          try {
            src = await createImageBitmap(blob, { imageOrientation: 'from-image' });
            w = src.width; h = src.height;
          } catch (_) { src = null; }
        }
        if (!src) {
          url = URL.createObjectURL(blob);
          src = await new Promise(function (res, rej) {
            const im = new Image();
            im.onload = function () { res(im); };
            im.onerror = rej;
            im.src = url;
          });
          w = src.naturalWidth; h = src.naturalHeight;
        }
        if (!w || !h) return null;
        const scale = Math.min(1, maxW / w, maxH / h);
        const tw = Math.max(1, Math.round(w * scale));
        const th = Math.max(1, Math.round(h * scale));
        let canvas, ctx;
        if (typeof OffscreenCanvas === 'function') {
          canvas = new OffscreenCanvas(tw, th);
          ctx = canvas.getContext('2d');
        }
        if (!ctx) {
          canvas = document.createElement('canvas');
          canvas.width = tw; canvas.height = th;
          ctx = canvas.getContext('2d');
        }
        if (!ctx) return null;
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(src, 0, 0, tw, th);
        if (src.close) { try { src.close(); } catch (_) {} }
        if (contrast !== 1 || brightness !== 1) {
          const c = Math.max(0, Math.min(2, contrast));
          const inv = 1 - c;
          const b = Math.max(0, brightness);
          const data = ctx.getImageData(0, 0, tw, th);
          const d = data.data;
          for (let i = 0; i < d.length; i += 4) {
            for (let k = 0; k < 3; k++) {
              let v = (d[i + k] / 255) * b;
              v = 0.5 * inv + v * c;
              d[i + k] = v <= 0 ? 0 : v >= 1 ? 255 : Math.round(v * 255);
            }
          }
          ctx.putImageData(data, 0, 0);
        }
        const q = quality / 100;
        let out;
        if (canvas.convertToBlob) {
          out = await canvas.convertToBlob({ type: 'image/jpeg', quality: q });
        } else {
          out = await new Promise(function (res) { canvas.toBlob(res, 'image/jpeg', q); });
        }
        if (!out) return null;
        const buf = new Uint8Array(await out.arrayBuffer());
        canvas.width = 0; canvas.height = 0; // release canvas memory early (iOS Safari)
        return { bytes: buf, width: tw, height: th };
      } catch (e) {
        console.warn('tashilResizeReceiptImage failed', e);
        return null;
      } finally {
        if (url) URL.revokeObjectURL(url);
      }
    };
  </script>
